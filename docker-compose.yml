version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
      POSTGRES_USER: ${POSTGRES_USER:-notesuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notesuser} -d ${POSTGRES_DB:-notesdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    command: sh -c "python manage.py migrate --noinput && exec gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-notesuser}:${POSTGRES_PASSWORD:-notespassword}@db:5432/${POSTGRES_DB:-notesdb}
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

  pytest:
    build:
      context: .
      target: test
    profiles: ["test"]
    command: python -m pytest
    volumes:
      - .:/app
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-notesuser}:${POSTGRES_PASSWORD:-notespassword}@db:5432/${POSTGRES_DB:-notesdb}
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
