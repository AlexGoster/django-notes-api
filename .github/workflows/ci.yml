name: Django Notes API CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy notes config
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notes_test
          POSTGRES_USER: notesuser
          POSTGRES_PASSWORD: notes-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notesuser -d notes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notesuser:notes-test-password@127.0.0.1:5432/notes_test
      SECRET_KEY: local-ci-key-with-at-least-32-bytes
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest --cov=notes --cov-report=xml
  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t django-notes-api:ci .
      - run: docker run --rm django-notes-api:ci python manage.py check
